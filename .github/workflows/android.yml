name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Three.js engine and loaders
        run: |
          set -euo pipefail
          mkdir -p video-maker/src/main/assets
          BASE=https://cdn.jsdelivr.net/npm/three@0.124.0
          curl -fLsS "$BASE/build/three.min.js" -o video-maker/src/main/assets/three.min.js
          curl -fLsS "$BASE/examples/js/controls/OrbitControls.js" -o video-maker/src/main/assets/OrbitControls.js
          curl -fLsS "$BASE/examples/js/loaders/GLTFLoader.js" -o video-maker/src/main/assets/GLTFLoader.js
          curl -fLsS "$BASE/examples/js/loaders/FBXLoader.js" -o video-maker/src/main/assets/FBXLoader.js
          curl -fLsS "$BASE/examples/js/loaders/OBJLoader.js" -o video-maker/src/main/assets/OBJLoader.js
          test -s video-maker/src/main/assets/three.min.js
          test -s video-maker/src/main/assets/OrbitControls.js
          test -s video-maker/src/main/assets/GLTFLoader.js
          test -s video-maker/src/main/assets/FBXLoader.js
          test -s video-maker/src/main/assets/OBJLoader.js
      - name: Build APK
        run: gradle :video-maker:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Video-Maker-APK
          path: video-maker/build/outputs/apk/debug/video-maker-debug.apk
