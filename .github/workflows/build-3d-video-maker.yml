name: Build 3D Video Maker APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'video-maker/**'
      - '.github/workflows/build-3d-video-maker.yml'
      - 'settings.gradle'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :video-maker:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Video-Maker-APK
          path: video-maker/build/outputs/apk/debug/video-maker-debug.apk
          if-no-files-found: error

