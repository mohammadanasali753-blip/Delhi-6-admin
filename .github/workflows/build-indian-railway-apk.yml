name: Build Indian Railway APK

on:
  workflow_dispatch:
  push:
    paths:
      - "railway-game/**"
      - ".github/workflows/build-indian-railway-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          test -x "$SDK_ROOT/build-tools/34.0.0/apksigner"
          test -f "$SDK_ROOT/platforms/android-34/android.jar"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -d "$SDK_ROOT/ndk/23.2.8568313"
          test -d "$SDK_ROOT/cmake/3.10.2.4988404"
          echo "Verified Android SDK components under $SDK_ROOT"
          ls -l "$SDK_ROOT/build-tools/34.0.0/apksigner" "$SDK_ROOT/platforms/android-34/android.jar" "$SDK_ROOT/platform-tools/adb"

      - name: Download Godot 4.3 and Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" /tmp/godot-templates /tmp/godot-bin
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          godot --version

      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: |
          mkdir -p railway-game/build
          godot --headless --editor --path railway-game --quit
          echo "---- Godot Android SDK settings ----"
          cat "$HOME/.config/godot/editor_settings-4.tres"
          echo "---- Export preset keystore settings ----"
          grep -E '^(keystore/debug|keystore/debug_user|keystore/debug_password|package/signed)=' railway-game/export_presets.cfg

      - name: Create Android debug keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/railway-game/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -s railway-game/debug.keystore
          # Use an absolute path so Godot's export validator can resolve the keystore.
          sed -i "s|^keystore/debug=.*|keystore/debug=\\"$GITHUB_WORKSPACE/railway-game/debug.keystore\\"|" railway-game/export_presets.cfg
          grep '^keystore/debug=' railway-game/export_presets.cfg

      - name: Export Android APK
        run: |
          godot --headless --verbose --path railway-game --export-debug "Android" build/IR-Open-World.apk
          test -s railway-game/build/IR-Open-World.apk
          ls -lh railway-game/build/IR-Open-World.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Indian-Railway-Open-World-APK
          path: railway-game/build/IR-Open-World.apk
          if-no-files-found: error
          retention-days: 14
