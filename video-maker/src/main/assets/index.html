<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Video Maker Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
#top{height:52px;background:#121725;display:flex;align-items:center;gap:7px;padding:7px;border-bottom:1px solid #272d3d}
button,label{background:#20283a;color:#fff;border:1px solid #39445c;border-radius:7px;padding:8px 10px;font-size:12px;cursor:pointer}
button:active,label:active{background:#39415a}input[type=file]{display:none}
#layout{height:calc(100vh - 52px);display:grid;grid-template-columns:1fr 250px}
#view{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}
#panel{background:#101522;border-left:1px solid #272d3d;padding:10px;overflow:auto}
h3{margin:5px 0 9px;font-size:15px}.sec{border-bottom:1px solid #252c3d;padding:8px 0}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1;min-width:70px}
select,input[type=number],input[type=text]{width:100%;background:#171e2d;color:#fff;border:1px solid #374158;border-radius:6px;padding:7px}
#status{position:absolute;left:10px;bottom:10px;background:#000b;padding:7px 9px;border-radius:7px;font-size:11px}
#timeline{position:absolute;left:10px;right:10px;bottom:10px;height:54px;background:#111827e8;border:1px solid #30394d;border-radius:8px;padding:7px;display:none}
small{color:#9ba6bd}.danger{border-color:#9b3c55}
</style>
</head><body>
<div id="top">
<label>📦 3D Model<input id="model" type="file" accept=".glb,.gltf,.fbx,.obj"></label>
<label>🙂 Face<input id="face" type="file" accept="image/*"></label>
<label>🎮 Gameplay<input id="video" type="file" accept="video/*"></label>
<button id="add">＋ Object</button><button id="dup">Duplicate</button><button id="del">Delete</button>
<button id="save">Save</button><label>Load<input id="load" type="file" accept=".json,application/json"></label>
<button id="rec">⏺ Record</button>
</div>
<div id="layout"><div id="view"><div id="status">Ready — import a GLB/GLTF model</div><div id="timeline"></div></div>
<aside id="panel">
<div class="sec"><h3>Scene</h3><select id="objects" size="7" style="height:145px"></select></div>
<div class="sec"><h3>Transform</h3>
<div class="row"><input id="px" type="number" step=".1" placeholder="X"><input id="py" type="number" step=".1" placeholder="Y"><input id="pz" type="number" step=".1" placeholder="Z"></div>
<div class="row"><input id="rx" type="number" step="1" placeholder="RX"><input id="ry" type="number" step="1" placeholder="RY"><input id="rz" type="number" step="1" placeholder="RZ"></div>
<div class="row"><input id="sx" type="number" step=".1" placeholder="SX"><input id="sy" type="number" step=".1" placeholder="SY"><input id="sz" type="number" step=".1" placeholder="SZ"></div>
</div>
<div class="sec"><h3>Character / Hand</h3><select id="bones"><option>No character selected</option></select>
<div class="row"><button id="attach">Attach selected object</button><button id="detach">Detach</button></div>
<small>Right/Left hand, wrist, palm and common Mixamo bone names are detected.</small></div>
<div class="sec"><h3>Face</h3><button id="applyFace">Apply uploaded face image</button><small>Applies the uploaded image to the selected mesh material where supported.</small></div>
<div class="sec"><h3>Timeline</h3><button id="key">Add keyframe</button><button id="clearKeys">Clear keys</button><div id="keys"><small>No keyframes</small></div></div>
<div class="sec"><h3>Camera</h3><button id="reset">Reset camera</button></div>
</aside></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/examples/js/loaders/OBJLoader.js"></script>
<script>
const view=document.getElementById('view'),status=document.getElementById('status'),sel=document.getElementById('objects'),bones=document.getElementById('bones');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080b12);
const camera=new THREE.PerspectiveCamera(55,1,.05,500);camera.position.set(4,3,7);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(4,8,5);scene.add(dl);
const grid=new THREE.GridHelper(20,20,0x39445c,0x202838);scene.add(grid);
let selected=null,character=null,faceURL=null,videoURL=null,keys=[];
function resize(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function msg(s){status.textContent=s}
function refresh(){sel.innerHTML='';scene.children.filter(o=>o.userData.editable).forEach(o=>{let op=document.createElement('option');op.textContent=o.userData.name||o.name;op.value=o.uuid;sel.appendChild(op)})}
function pick(o){selected=o;if(o){sel.value=o.uuid;document.getElementById('px').value=o.position.x.toFixed(2);document.getElementById('py').value=o.position.y.toFixed(2);document.getElementById('pz').value=o.position.z.toFixed(2);document.getElementById('rx').value=THREE.MathUtils.radToDeg(o.rotation.x).toFixed(0);document.getElementById('ry').value=THREE.MathUtils.radToDeg(o.rotation.y).toFixed(0);document.getElementById('rz').value=THREE.MathUtils.radToDeg(o.rotation.z).toFixed(0);document.getElementById('sx').value=o.scale.x.toFixed(2);document.getElementById('sy').value=o.scale.y.toFixed(2);document.getElementById('sz').value=o.scale.z.toFixed(2);if(o.isObject3D)loadBones(o)}}
function loadBones(o){bones.innerHTML='';let found=[];o.traverse(x=>{if(x.isBone&&/hand|wrist|palm/i.test(x.name))found.push(x)});if(!found.length)o.traverse(x=>{if(x.isBone)found.push(x)});found.slice(0,80).forEach(b=>{let op=document.createElement('option');op.textContent=b.name;op.value=b.uuid;bones.appendChild(op)});if(!found.length){let op=document.createElement('option');op.textContent='No bones found';bones.appendChild(op)}}
sel.onchange=()=>pick(scene.getObjectByProperty('uuid',sel.value));
['px','py','pz','rx','ry','rz','sx','sy','sz'].forEach(id=>document.getElementById(id).oninput=()=>{if(!selected)return;let v=parseFloat(document.getElementById(id).value)||0;if(id[0]=='p')selected.position[id[1]]=v;else if(id[0]=='r')selected.rotation[id[1]]=THREE.MathUtils.degToRad(v);else selected.scale[id[1]]=v});
document.getElementById('add').onclick=()=>{let m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x8b5cf6}));m.userData={editable:true,name:'Object '+(scene.children.length)};scene.add(m);pick(m);refresh();msg('Object added')};
document.getElementById('dup').onclick=()=>{if(!selected)return;let d=selected.clone();d.position.x+=.7;d.userData={...selected.userData,name:(selected.userData.name||'Object')+' Copy',editable:true};scene.add(d);pick(d);refresh()};
document.getElementById('del').onclick=()=>{if(!selected)return;scene.remove(selected);selected=null;refresh();msg('Deleted')};
document.getElementById('reset').onclick=()=>{camera.position.set(4,3,7);controls.target.set(0,1,0);controls.update()};
document.getElementById('model').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),ext=f.name.split('.').pop().toLowerCase();msg('Loading '+f.name+'…');if(ext==='obj'){new THREE.OBJLoader().load(url,o=>{o.userData={editable:true,name:f.name};scene.add(o);pick(o);refresh();msg('Model imported')},undefined,()=>msg('OBJ load failed'))}else if(ext==='fbx'){new THREE.FBXLoader().load(url,o=>{o.userData={editable:true,name:f.name};scene.add(o);character=o;pick(o);refresh();msg('FBX imported')},undefined,()=>msg('FBX load failed'))}else{new THREE.GLTFLoader().load(url,g=>{let o=g.scene;o.userData={editable:true,name:f.name};scene.add(o);character=o;pick(o);refresh();msg('GLB/GLTF imported')},undefined,()=>msg('GLB/GLTF load failed'))}};
document.getElementById('attach').onclick=()=>{if(!selected||!character)return msg('Select an object and character first');let b=character.getObjectByProperty('uuid',bones.value);if(!b||!b.isBone)return msg('Select a hand/wrist bone');b.attach(selected);selected.userData.attachedTo=b.name;msg('Attached to '+b.name);};
document.getElementById('detach').onclick=()=>{if(!selected)return;scene.attach(selected);delete selected.userData.attachedTo;msg('Detached')};
document.getElementById('face').onchange=e=>{let f=e.target.files[0];if(f)faceURL=URL.createObjectURL(f);msg('Face image ready')};
document.getElementById('applyFace').onclick=()=>{if(!selected||!faceURL)return msg('Select mesh and upload face image');let tx=new THREE.TextureLoader().load(faceURL);selected.traverse(o=>{if(o.isMesh){if(Array.isArray(o.material))o.material=o.material.map(m=>{let n=m.clone();n.map=tx;n.needsUpdate=true;return n});else{let n=o.material.clone();n.map=tx;n.needsUpdate=true;o.material=n}}});msg('Face texture applied')};
document.getElementById('video').onchange=e=>{let f=e.target.files[0];if(!f)return;videoURL=URL.createObjectURL(f);let v=document.createElement('video');v.src=videoURL;v.loop=true;v.muted=true;v.playsInline=true;v.play();let tex=new THREE.VideoTexture(v);let p=new THREE.Mesh(new THREE.PlaneGeometry(8,4.5),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));p.position.set(0,2,-4);p.userData={editable:true,name:'Gameplay Video'};scene.add(p);pick(p);refresh();msg('Gameplay video added as reference plane')};
document.getElementById('key').onclick=()=>{if(!selected)return msg('Select an object');keys.push({t:Date.now(),name:selected.userData.name,p:[...selected.position.toArray()],r:[selected.rotation.x,selected.rotation.y,selected.rotation.z],s:[...selected.scale.toArray()]});document.getElementById('keys').innerHTML='<small>'+keys.length+' keyframe(s) saved</small>';msg('Keyframe added')};
document.getElementById('clearKeys').onclick=()=>{keys=[];document.getElementById('keys').innerHTML='<small>No keyframes</small>'};
document.getElementById('save').onclick=()=>{let data={version:2,keys,objects:scene.children.filter(o=>o.userData.editable).map(o=>({name:o.userData.name,position:o.position.toArray(),rotation:[o.rotation.x,o.rotation.y,o.rotation.z],scale:o.scale.toArray()}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='3d-video-project.json';a.click()};
document.getElementById('load').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);keys=d.keys||[];for(const x of d.objects||[]){let m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x8b5cf6}));m.userData={editable:true,name:x.name};m.position.fromArray(x.position);m.rotation.set(...x.rotation);m.scale.fromArray(x.scale);scene.add(m)}refresh();msg('Project loaded; imported models must be re-added from files')};r.readAsText(f)};
let recorder,chunks=[];document.getElementById('rec').onclick=()=>{if(recorder&&recorder.state==='recording'){recorder.stop();msg('Recording stopped');return}chunks=[];let stream=renderer.domElement.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:'video/webm'});recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='3d-video.webm';a.click()};recorder.start();msg('Recording… tap Record again to stop')};
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
</script></body></html>
